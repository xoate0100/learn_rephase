template_repo: "https://github.com/xoate0100/project_initializer.git"
installed_at: "2024-01-01T00:00:00Z"
last_updated_at: "2024-12-19T00:00:00Z"

update_history:
  - from_version: "1.0.0"
    to_version: "1.1.0"
    updated_at: "2024-01-15T00:00:00Z"
    migration_applied: false
    notes: "Added feedback collection system, improved authentication handling"
  - from_version: "1.1.0"
    to_version: "1.2.0"
    updated_at: "2024-01-20T00:00:00Z"
    migration_applied: false
    notes: "Added legacy project upgrade system with AI-agent friendly workflow"
  - from_version: "1.2.0"
    to_version: "1.3.0"
    updated_at: "2024-12-19T00:00:00Z"
    migration_applied: false
    notes: "Fixed pre-versioned migration issues: added init_versioning.py, fixed 'latest' version handling, added CLI detection, improved update_history population"
  - from_version: "1.3.0"
    to_version: "1.4.0"
    updated_at: "2024-12-19T00:00:00Z"
