  guided_initialization: true
  dynamic_ai_context: true
  template_versioning: true
  drift_detection: true
  feedback_collection: true
  legacy_upgrade: true
  hub_and_spoke_model: true
  standardized_feedback: true

# Directories that are part of the template and can be updated
template_directories:
  - "0_phase0_bootstrap/"
  - "1_global_standards/"
  - "2_framework_templates/"
  - "3_bootstrap_scripts/"
  - "5_reference_architectures/"
  - "7_schemas/"
  - "8_ci/"

# Files in template directories that should NOT be overwritten (project customizations)
protected_files:
  - "0_phase0_bootstrap/MVP_SPECIFICATION.yaml"
  - "0_phase0_bootstrap/feature_flags.yml"  # May have project-specific overrides

# Directories that are project-specific and should never be overwritten
project_directories:
  - "4_docs_index/"
  - "6_ai_runtime_context/"
  - "frontend/"
  - "backend/"
  - "shared/"
  - "apps/"
  - "packages/"
  - "docs/"  # Project-specific documentation (not template docs)
